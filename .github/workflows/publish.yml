# Build flask-base and attach wheels to a GitHub Release on version tags.
#
# Usage: git tag v0.2.0 && git push origin v0.2.0

name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          pip install build
          cd flask_base
          python -m build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: flask_base/dist/*.whl
          generate_release_notes: true
